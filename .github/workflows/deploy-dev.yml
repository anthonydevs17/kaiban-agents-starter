name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t kaiban-a2a-agent-starter:dev .

      - name: Deploy (sample)
        run: echo "Deploying container... (replace with your registry/infra steps)"
