name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create envfile
        run: |
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL }}" >> .env
          echo "PORT=4000" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "KAIBAN_API_BASE_URL=${{ vars.KAIBAN_API_BASE_URL }}" >> .env
          echo "KAIBAN_API_TOKEN=${{ secrets.KAIBAN_API_TOKEN }}" >> .env
          echo "A2A_BASE_URL=${{ vars.A2A_BASE_URL }}" >> .env

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t kaiban-a2a-agent-starter:dev .

      - name: Deploy (sample)
        run: echo "Deploying container... (replace with your registry/infra steps)"
